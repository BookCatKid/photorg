name: Build IPA for Sidestore

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Project
        run: xcodegen generate

      - name: Build IPA
        run: |
          xcodebuild -project Photorg.xcodeproj \
            -scheme Photorg \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build

      - name: Create IPA
        run: |
          app_path=build/Build/Products/Debug-iphoneos/Photorg.app
          ipa_path=Photorg.ipa

          mkdir -p Payload
          cp -R "$app_path" Payload/Photorg.app
          zip -qr "$ipa_path" Payload
          rm -rf Payload

          ls -la "$ipa_path"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Photorg-IPA
          path: Photorg.ipa
          retention-days: 30
