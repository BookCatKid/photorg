name: Photorg
options:
  bundleIdPrefix: dev.smrff
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Photorg:
    type: application
    platform: iOS
    sources:
      - path: Photorg
        excludes:
          - "**/.DS_Store"
          - "**/Assets.xcassets"
    info:
      path: Photorg/Info.plist
      properties:
        CFBundleDisplayName: Photorg
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Photorg uses the camera so you can shoot photos directly into the active collection."
        NSPhotoLibraryUsageDescription: "Photorg can import existing photos from your library into a collection."
        NSPhotoLibraryAddUsageDescription: "Photorg can export cropped renders back to your Photos library."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Photorg
        GENERATE_INFOPLIST_FILE: NO
